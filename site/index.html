<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>My Picks · NBA Pick'em</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏀 NBA Pick'em</h1>
    <nav>
      <a href="index.html" class="active">My Picks</a>
      <a href="picks.html">Weekly Picks</a>
      <a href="standings.html">Standings</a>
    </nav>
  </header>
  <main>
    <p class="subhead" id="subhead"></p>
    <div id="message"></div>
    <div id="games"></div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const token = getToken();
    const msg = document.getElementById("message");
    const list = document.getElementById("games");
    const subhead = document.getElementById("subhead");
    let teams = {}, games = [], week = null;
    let saved = {};    // picks stored in the database: game_id -> team_id
    let saving = {};   // taps waiting on the database: game_id -> team_id
    let queue = {};    // per-game save chain, so quick re-taps save in order

    async function init() {
      if (!requireConfig(msg)) return;
      if (!token) {
        showNotice(msg, "Open the private link you were sent to make picks. You can still see <a href='picks.html'>Weekly Picks</a> and <a href='standings.html'>Standings</a>.");
        return;
      }
      try {
        const [me] = await rpc("get_me", { p_token: token });
        if (!me) {
          showNotice(msg, "That link isn't valid. Ask the commissioner for yours.", true);
          return;
        }
        [teams, week] = await Promise.all([loadTeams(), loadWeeks().then(currentWeek)]);
        if (!week) {
          subhead.textContent = `Hi, ${me.display_name}.`;
          showNotice(msg, "No slate yet. The first one posts the Monday before opening night.");
          return;
        }
        subhead.textContent = `Hi, ${me.display_name} · ${weekLabel(week)}`;
        games = await loadSlateGames(week.id);
        await refreshPicks();
        showSummary();
        render();
        setInterval(render, 30000); // flip games to locked as tip-offs pass
      } catch (e) {
        showNotice(msg, `Couldn't load picks: ${esc(e.message)}`, true);
      }
    }

    async function refreshPicks() {
      const rows = await rpc("get_my_picks", { p_token: token, p_week_id: week.id });
      saved = Object.fromEntries(rows.map((r) => [r.game_id, r.picked_team_id]));
    }

    const pickedCount = () => games.filter((g) => saved[g.id]).length;

    function showSummary() {
      if (!games.length) {
        showNotice(msg, "No games this week (e.g., All-Star break). Enjoy the week off.");
        return;
      }
      const needPick = games.filter((g) => !isLocked(g) && !saved[g.id]).length;
      showNotice(msg, `<strong>${pickedCount()} of ${games.length} picked.</strong> ` +
        (needPick ? `${needPick} open game${needPick > 1 ? "s still need" : " still needs"} a pick. ` : "You're all set. ") +
        "Each tap saves instantly; change any pick until tip-off.");
    }

    function teamButton(game, teamId, score) {
      const t = teams[teamId] || { abbreviation: "?", name: "" };
      const picked = (saving[game.id] ?? saved[game.id]) === teamId;
      const winner = winnerId(game);
      const classes = ["team-btn"];
      if (picked) classes.push("picked");
      if (picked && saving[game.id]) classes.push("saving");
      if (picked && winner) classes.push(winner === teamId ? "correct" : "wrong");
      return `<button class="${classes.join(" ")}" data-game="${game.id}" data-team="${teamId}"
                ${isLocked(game) ? "disabled" : ""} aria-pressed="${picked}">
                <span class="abbr">${esc(t.abbreviation)}</span>
                <span class="name">${esc(t.name)}</span>
                ${game.status === "final" || game.status === "in_progress" ? `<span class="score">${score ?? ""}</span>` : ""}
              </button>`;
    }

    function pickState(game) {
      if (saving[game.id]) return `<span class="pick-state">Saving…</span>`;
      if (saved[game.id]) return `<span class="pick-state ok">✓ Pick saved</span>`;
      if (!isLocked(game)) return `<span class="pick-state todo">No pick yet</span>`;
      return "";
    }

    function render() {
      if (!games.length) {
        list.innerHTML = "";
        return;
      }
      list.innerHTML = games.map((g) => `
        <div class="game">
          <div class="game-meta"><span>${tipoffLabel(g)}</span><span>${statusLabel(g)}</span></div>
          <div class="teams">
            ${teamButton(g, g.away_team_id, g.away_score)}
            <span class="at">@</span>
            ${teamButton(g, g.home_team_id, g.home_score)}
          </div>
          <div class="game-foot">${pickState(g)}</div>
        </div>`).join("");
    }

    list.addEventListener("click", async (e) => {
      const btn = e.target.closest(".team-btn");
      if (!btn || btn.disabled) return;
      const gameId = Number(btn.dataset.game);
      const teamId = Number(btn.dataset.team);
      if (saved[gameId] === teamId && !saving[gameId]) return;
      saving[gameId] = teamId;
      render();
      const abbr = esc((teams[teamId] || {}).abbreviation || "?");
      try {
        const save = (queue[gameId] || Promise.resolve()).catch(() => {})
          .then(() => rpc("submit_pick", { p_token: token, p_game_id: gameId, p_team_id: teamId }));
        queue[gameId] = save;
        await save;
        if (saving[gameId] !== teamId) return; // a newer tap on this game is queued
        saved[gameId] = teamId;
        delete saving[gameId];
        const time = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
        showNotice(msg, `<strong>✓ ${abbr} saved at ${time}.</strong> ${pickedCount()} of ${games.length} picked. ` +
          "Change any pick until tip-off.");
      } catch (err) {
        if (saving[gameId] === teamId) delete saving[gameId];
        showNotice(msg, `<strong>${abbr} NOT saved:</strong> ${esc(err.message)}. Your previous pick still stands.`, true);
      }
      render();
    });

    // Warn before leaving while a pick is still being saved.
    window.addEventListener("beforeunload", (e) => {
      if (Object.keys(saving).length) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    init();
  </script>
</body>
</html>
