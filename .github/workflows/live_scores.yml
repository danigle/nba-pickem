name: Live scores

# Every 30 minutes Thu–Mon (UTC), which covers Thu–Sun game nights in PT.
# Results show up the same night. The job exits immediately (no balldontlie
# calls) when no game is in its live window.

on:
  schedule:
    - cron: "7,37 * * * 0,1,4,5,6"
  workflow_dispatch:

permissions:
  contents: read

# Own group: must never queue behind (or bump) the daily or Monday jobs.
concurrency: live-scores

jobs:
  live:
    if: vars.PICKEM_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r jobs/requirements.txt
      - run: python jobs/live_scores.py
