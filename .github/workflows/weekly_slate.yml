name: Weekly slate

# Monday morning PT: refresh scores (so Sunday is final), then pick the
# Thu–Sun slate. Turned off until the repo variable PICKEM_ENABLED is "true".

on:
  schedule:
    # Mondays 13:37 UTC = 6:37am PDT / 5:37am PST (off the top of the hour, which GitHub delays).
    # Retries Monday afternoon and Tuesday morning in case GitHub can't start the job;
    # once the week has a slate, later runs do nothing.
    - cron: "37 13 * * 1"
    - cron: "37 19 * * 1"
    - cron: "37 13 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (blank = this week)"
        required: false
      force:
        description: "Replace an existing slate"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: pickem-jobs

jobs:
  slate:
    if: vars.PICKEM_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r jobs/requirements.txt
      - run: python jobs/ingest_schedule.py
      - name: Generate slate
        env:
          WEEK: ${{ inputs.week }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ -n "$WEEK" ] && args+=(--week "$WEEK")
          [ "$FORCE" = "true" ] && args+=(--force)
          python jobs/generate_slate.py "${args[@]}"
