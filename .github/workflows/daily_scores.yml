name: Daily scores

# Refreshes the whole season from balldontlie: scores, statuses, reschedules.
# Also keeps the Supabase free tier from pausing.
# Turned off until the repo variable PICKEM_ENABLED is set to "true".

on:
  schedule:
    # 09:23 UTC = 2:23am PDT / 1:23am PST, after West Coast games end.
    # Off the top of the hour: GitHub delays on-the-hour schedules by hours.
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # lets the keep-alive step re-enable scheduled workflows

concurrency: pickem-jobs

jobs:
  scores:
    if: vars.PICKEM_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r jobs/requirements.txt
      - run: python jobs/ingest_schedule.py
      # GitHub disables scheduled workflows after 60 days without repo
      # activity. Re-enabling them via the API is meant to reset that clock.
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable daily_scores.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable weekly_slate.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable live_scores.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable backup.yml --repo "$GITHUB_REPOSITORY"
