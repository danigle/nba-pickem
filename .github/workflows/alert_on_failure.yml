name: Failure alert

# Watches the scheduled jobs and opens (or comments on) an issue that
# @mentions the commissioner when one fails. Runs separately from the job it
# watches, so it also catches failures where the job never started (e.g.
# "The job was not acquired by Runner", Oct 5 2026). Runs cancelled by their
# own concurrency queue are not failures and are ignored.

on:
  workflow_run:
    workflows: ["Daily scores", "Weekly slate", "Live scores", "Weekly backup"]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: .github/scripts/report-failure.sh
